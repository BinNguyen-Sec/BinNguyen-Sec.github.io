name: Build English Resume PDF

on:
  push:
    paths:
      - 'resume-src/Nguyen-Ngoc-Khai-Resume-English.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WeasyPrint
        run: pip install weasyprint

      - name: Generate PDF
        run: |
          mkdir -p public/resume
          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML
          src = Path('resume-src/Nguyen-Ngoc-Khai-Resume-English.html')
          out = Path('public/resume/Nguyen-Ngoc-Khai-Resume-English.pdf')
          HTML(filename=str(src)).write_pdf(str(out))
          print(f'Generated {out} ({out.stat().st_size} bytes)')
          PY

      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/resume/Nguyen-Ngoc-Khai-Resume-English.pdf
          git diff --cached --quiet || git commit -m 'Add English resume PDF'
          git push